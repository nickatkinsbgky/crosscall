<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0c1220" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="HelloDarlin'" />
  <title>HelloDarlin'</title>
  <link rel="manifest" href="manifest.json" />
  <script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
  <style>
    .hidden { display: none !important; }

    :root {
    .hidden { display: none !important; }
      --bg: #0c1220; --card: #161e2e; --line: #2a3650; --text: #f4f7fb;
      --muted: #9aa8be; --blue: #3d7eff; --danger: #ff5d6c; --ok: #3dd68c;
      --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overscroll-behavior: none; touch-action: manipulation; }
    button, input { font: inherit; color: inherit; }
    .screen { min-height: 100dvh; padding-top: var(--safe-top); padding-bottom: var(--safe-bottom); }
    .lobby { max-width: 460px; margin: 0 auto; padding: calc(28px + var(--safe-top)) 18px calc(40px + var(--safe-bottom)); }
    .brand { display: flex; gap: 12px; align-items: center; margin-bottom: 18px; }
    .logo { width: 46px; height: 46px; border-radius: 14px; object-fit: cover; }
    h1 { margin: 0; font-size: 28px; letter-spacing: -.04em; }
    .sub { color: var(--muted); margin: 4px 0 0; font-size: 14px; line-height: 1.4; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; margin-top: 14px; }
    label { display: block; color: var(--muted); font-size: 12px; margin: 10px 0 6px; }
    input { width: 100%; background: #0f1728; border: 1px solid var(--line); border-radius: 12px; padding: 14px; outline: none; font-size: 16px; }
    input:focus { border-color: var(--blue); }
    .row { display: flex; gap: 8px; margin-top: 12px; }
    .btn { border: 0; border-radius: 12px; padding: 14px 16px; background: var(--blue); font-weight: 700; cursor: pointer; min-height: 48px; font-size: 16px; }
    .btn.secondary { background: #0f1728; border: 1px solid var(--line); font-weight: 600; }
    .btn.full { width: 100%; }
    .btn:disabled { opacity: .55; }
    .btn:active { transform: scale(0.98); }
    .fine { color: var(--muted); font-size: 13px; line-height: 1.45; margin-top: 8px; }
    .call { display: flex; flex-direction: column; min-height: 100dvh; padding-bottom: var(--safe-bottom); position: relative; }
    .top { display: flex; justify-content: space-between; align-items: center; padding: calc(14px + var(--safe-top)) 14px 8px; gap: 8px; position: absolute; top: 0; left: 0; right: 0; z-index: 20; background: linear-gradient(to bottom, rgba(12,18,32,.7), transparent); }
    .pill { background: rgba(18,32,51,.8); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 13px; color: var(--muted); max-width: 55%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
    
    .video-stage { position: absolute; inset: 0; background: linear-gradient(135deg, #1a0a2e 0%, #0c1220 40%, #1a2744 100%); display: grid; overflow: hidden; }
    .video-stage::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 20% 30%, rgba(255,105,180,.15), transparent 40%), radial-gradient(circle at 80% 70%, rgba(61,126,255,.2), transparent 45%); animation: glow 6s ease-in-out infinite alternate; pointer-events: none; }
    @keyframes glow { 0% { opacity: .6; } 100% { opacity: 1; } }
    .floating-emoji { position: absolute; font-size: 28px; animation: floatAround 8s linear infinite; opacity: .4; pointer-events: none; z-index: 5; }
    @keyframes floatAround { 0% { transform: translateY(100vh) rotate(0deg); } 100% { transform: translateY(-20vh) rotate(360deg); } }
    .video-stage.solo { grid-template-columns: 1fr; }
    .video-stage.group { grid-template-columns: 1fr 1fr; grid-auto-rows: 1fr; gap: 6px; padding: 70px 8px 90px; }
    .video-stage.group.three { grid-template-columns: 1fr 1fr; }
    .remote-tile { position: relative; background: linear-gradient(145deg, #1a2744, #0f1728); border-radius: 16px; overflow: hidden; min-height: 0; box-shadow: 0 4px 20px rgba(0,0,0,.4); border: 1px solid rgba(61,126,255,.15); }
    .remote-tile video { width: 100%; height: 100%; object-fit: cover; background: #0b1220; }
    .video-stage.solo .remote-tile { position: absolute; inset: 0; border-radius: 0; border: none; box-shadow: none; }
    .local-tile { position: absolute; right: 14px; bottom: calc(96px + var(--safe-bottom)); width: 112px; height: 152px; z-index: 15; border-radius: 18px; border: 3px solid rgba(61,126,255,.6); overflow: hidden; box-shadow: 0 6px 24px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.1); cursor: pointer; background: #10192b; }
    @media (min-width: 600px) { .local-tile { width: 140px; height: 190px; } }
    .local-tile video { width: 100%; height: 100%; object-fit: cover; }
    .tag { position: absolute; left: 8px; bottom: 8px; background: rgba(0,0,0,.55); backdrop-filter: blur(8px); border-radius: 999px; padding: 5px 10px; font-size: 12px; font-weight: 600; color: #fff; }
    .controls { position: absolute; bottom: 0; left: 0; right: 0; display: flex; justify-content: center; gap: 16px; padding: 12px 16px calc(18px + var(--safe-bottom)); background: linear-gradient(to top, rgba(10,14,26,.95), transparent); z-index: 20; }
    .round { width: 58px; height: 58px; border-radius: 50%; border: 0; background: linear-gradient(160deg, #2a3a5c, #1b2740); color: white; font-size: 13px; font-weight: 700; display: grid; place-items: center; cursor: pointer; box-shadow: 0 4px 12px rgba(0,0,0,.3); transition: transform .1s; }
    .round:active { transform: scale(0.94); }
    .round.off { background: linear-gradient(160deg, #4a3038, #3a2a2e); color: #ffb4bc; }
    .round.end { background: linear-gradient(160deg, #ff6b7a, #ff5d6c); color: #2a0b10; width: 66px; height: 66px; }
    .top { display: flex; justify-content: space-between; align-items: center; padding: calc(14px + var(--safe-top)) 14px 8px; gap: 8px; position: absolute; top: 0; left: 0; right: 0; z-index: 20; background: linear-gradient(to bottom, rgba(10,14,26,.8), transparent); }
    .pill { background: rgba(18,32,51,.75); backdrop-filter: blur(10px); border: 1px solid rgba(61,126,255,.25); border-radius: 999px; padding: 6px 14px; font-size: 13px; color: #c8d4e8; max-width: 55%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
    .status { color: #5ee0a0; font-size: 13px; font-weight: 600; text-shadow: 0 1px 4px rgba(0,0,0,.4); }
    .waiting-fun { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; pointer-events: none; background: radial-gradient(circle at 50% 40%, rgba(61,126,255,.12), transparent 60%); }
    .waiting-fun .hearts { font-size: 72px; animation: bounce 1.6s ease-in-out infinite; filter: drop-shadow(0 8px 16px rgba(255,105,180,.5)); }
    .waiting-fun .msg { margin-top: 16px; font-size: 20px; font-weight: 700; color: #fff; text-shadow: 0 2px 12px rgba(0,0,0,.6); }
    .waiting-fun .submsg { font-size: 14px; color: #a0b0c8; margin-top: 6px; }
    
    .favorites-bar { position: absolute; top: 108px; left: 12px; right: 12px; z-index: 21; display: flex; gap: 8px; overflow-x: auto; padding: 4px 0; }
    .fav-chip { background: rgba(18,32,51,.85); backdrop-filter: blur(10px); border: 1px solid rgba(61,126,255,.35); border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 600; color: #e8f0ff; white-space: nowrap; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .fav-chip:active { transform: scale(0.96); }
    .fav-chip .dot { width: 8px; height: 8px; border-radius: 50%; background: #3dd68c; }
    .fav-edit-btn { background: rgba(61,126,255,.25); border: 1px solid rgba(61,126,255,.5); border-radius: 999px; padding: 8px 12px; font-size: 13px; color: #fff; cursor: pointer; }
    .fav-modal { position: fixed; inset: 0; z-index: 200; background: rgba(8,12,22,.92); display: flex; flex-direction: column; padding: calc(20px + var(--safe-top)) 16px calc(20px + var(--safe-bottom)); }
    .fav-modal h3 { margin: 0 0 12px; font-size: 20px; }
    .fav-list { flex: 1; overflow-y: auto; }
    .fav-row { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; }
    .fav-row input { flex: 1; background: #0f1728; border: 1px solid #2a3650; border-radius: 10px; padding: 10px; font-size: 15px; }
    .fav-row button { background: #ff5d6c; color: #fff; border: 0; border-radius: 10px; padding: 10px 12px; font-weight: 700; }
    .fav-add { background: #3d7eff; color: #fff; border: 0; border-radius: 12px; padding: 12px; font-weight: 700; width: 100%; margin-top: 8px; }
    .fav-close { background: #1b2740; color: #fff; border: 0; border-radius: 12px; padding: 12px; font-weight: 700; width: 100%; margin-top: 8px; }

    .invite-bar { margin-top: 10px; padding: 12px 14px; background: rgba(15,23,40,.85); backdrop-filter: blur(12px); border: 1px solid rgba(61,126,255,.3); border-radius: 16px; font-size: 13px; display: flex; align-items: center; gap: 8px; position: absolute; top: 58px; left: 12px; right: 12px; z-index: 20; box-shadow: 0 4px 16px rgba(0,0,0,.3); }

    .copy-link-btn { min-height: 36px; padding: 6px 12px; font-size: 13px; }

    .waiting-fun { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; pointer-events: none; }
    .waiting-fun .hearts { font-size: 48px; animation: float 3s ease-in-out infinite; }
    .waiting-fun .msg { margin-top: 12px; font-size: 18px; font-weight: 600; color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,.5); }
    .waiting-fun .submsg { font-size: 14px; color: #ccc; margin-top: 4px; }
    @keyframes bounce { 0%, 100% { transform: scale(1) translateY(0); } 50% { transform: scale(1.1) translateY(-16px); } }
    .video-stage.solo:has(.local-tile):not(:has(.remote-tile)) .waiting-fun { display: flex; }

  </style>
</head>
<body>
  <div id="lobby" class="screen lobby">
    <div class="brand">
      <img class="logo" src="icon-192.png" alt="HelloDarlin'" />
      <div>
        <h1>HelloDarlin'</h1>
        <p class="sub" id="lobbySub">Video calls that work on iPhone, Android, and desktop.</p>
      </div>
    </div>
    <div class="card">
      <label for="name">Your name</label>
      <input id="name" type="text" placeholder="Your name" autocomplete="name" />
      <label for="room" id="roomLabel">Room code</label>
      <input id="room" type="text" placeholder="Leave blank to create a new room" autocomplete="off" />
      <div class="row" id="actionRow">
        <button id="createBtn" class="btn full">Create Room</button>
        <button id="joinBtn" class="btn secondary full">Join Room</button>
      </div>
      <p class="fine" id="lobbyFine">Create a room and share the invite link. Multiple people can join the same room for a group call.</p>
      <div id="lobbyErr" class="err hidden"></div>
    </div>
  </div>

</body>
