<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0c1220" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="HelloDarlin'" />
  <title>HelloDarlin'</title>
  <link rel="manifest" href="manifest.json" />
  <script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
  <style>
    .hidden { display: none !important; }
    :root {
      --bg: #0c1220; --card: #161e2e; --line: #2a3650; --text: #f4f7fb;
      --muted: #9aa8be; --blue: #3d7eff; --danger: #ff5d6c; --ok: #3dd68c;
      --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .lobby { max-width: 460px; margin: 0 auto; padding: 28px 18px; }
    .brand { display: flex; gap: 12px; align-items: center; margin-bottom: 18px; }
    .logo { width: 46px; height: 46px; border-radius: 14px; }
    h1 { margin: 0; font-size: 28px; }
    .sub { color: var(--muted); margin: 4px 0 0; font-size: 14px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; margin-top: 14px; }
    label { display: block; color: var(--muted); font-size: 12px; margin: 10px 0 6px; }
    input { width: 100%; background: #0f1728; border: 1px solid var(--line); border-radius: 12px; padding: 14px; outline: none; font-size: 16px; }
    .btn { border: 0; border-radius: 12px; padding: 14px 16px; background: var(--blue); font-weight: 700; cursor: pointer; min-height: 48px; font-size: 16px; width: 100%; margin-top: 8px; }
    .btn.secondary { background: #0f1728; border: 1px solid var(--line); }
    .btn.ok { background: var(--ok); color: #0b1a10; }
    .fine { color: var(--muted); font-size: 13px; margin-top: 8px; }
    .link-box { background: #0f1728; border: 1px solid var(--line); border-radius: 12px; padding: 12px; font-size: 14px; word-break: break-all; margin-top: 8px; color: #c8d4e8; }
    .status { font-size: 13px; color: var(--ok); margin-top: 6px; }
    #callScreen { position: fixed; inset: 0; background: #000; display: none; }
    #callScreen.active { display: block; }
    #remoteVideo { width: 100%; height: 100%; object-fit: cover; }
    #localVideo { position: absolute; right: 16px; bottom: 90px; width: 120px; height: 160px; border-radius: 16px; border: 2px solid #3d7eff; object-fit: cover; }
    .call-controls { position: absolute; bottom: 20px; left: 0; right: 0; display: flex; justify-content: center; gap: 16px; }
    .round { width: 60px; height: 60px; border-radius: 50%; border: 0; font-weight: 700; cursor: pointer; }
    .round.end { background: #ff5d6c; color: #fff; }
    .incoming { position: fixed; inset: 0; background: rgba(8,12,22,.95); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
    .incoming.show { display: flex; }
  </style>
</head>
<body>
  <div id="lobby" class="lobby">
    <div class="brand">
      <img class="logo" src="icon-192.png" alt="HelloDarlin'" />
      <div>
        <h1>HelloDarlin'</h1>
        <p class="sub" id="lobbySub">Your personal video call link</p>
      </div>
    </div>

    <div class="card">
      <label for="permanentIdInput">Your permanent ID</label>
      <input id="permanentIdInput" type="text" placeholder="e.g. nick" autocomplete="off" />
      <button id="setPermanentBtn" class="btn">Set My Link</button>
      <div id="permanentLinkDisplay" class="link-box">No permanent link set</div>
      <button id="copyPermanentBtn" class="btn secondary">Copy Link</button>
      <div id="listenStatus" class="status hidden">Listening for calls…</div>
      <p class="fine">Share this link. Anyone who opens it calls you directly. Keep this page open (or the app) to receive calls.</p>
    </div>

    <div class="card" id="callerCard" class="hidden">
      <label for="name">Your name</label>
      <input id="name" type="text" placeholder="Your name" autocomplete="name" />
      <button id="callBtn" class="btn ok">Call</button>
      <p class="fine" id="callerFine"></p>
    </div>
  </div>

  <div id="incoming" class="incoming">
    <h2>Incoming call</h2>
    <p id="callerName">Someone is calling…</p>
    <div style="display:flex;gap:16px;margin-top:20px;">
      <button id="declineBtn" class="round" style="background:#3a2a2e;color:#ffb4bc;">Decline</button>
      <button id="acceptBtn" class="round" style="background:#3dd68c;color:#0b1a10;">Accept</button>
    </div>
  </div>

  <div id="callScreen">
    <video id="remoteVideo" autoplay playsinline></video>
    <video id="localVideo" autoplay playsinline muted></video>
    <div class="call-controls">
      <button id="endBtn" class="round end">End</button>
    </div>
  </div>

  <script src="permanent.js"></script>
  <script>
    const ICE = [{ urls: 'stun:stun.l.google.com:19302' }];
    let localStream = null;
    let peer = null;
    let activeCalls = [];
    let pendingCall = null;
    let wakeLock = null;
    let myName = 'User';

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    // --- Freeze recovery ---
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
      } catch (e) {}
    }
    async function restartLocalMedia() {
      try {
        if (localStream) localStream.getTracks().forEach(t => t.stop());
        localStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: true });
        const lv = document.getElementById('localVideo');
        if (lv) lv.srcObject = localStream;
        return localStream;
      } catch (e) { console.warn(e); return null; }
    }
    async function replaceTracksInCalls(stream) {
      if (!stream) return;
      for (const call of activeCalls) {
        try {
          const pc = call.peerConnection;
          if (!pc) continue;
          for (const sender of pc.getSenders()) {
            if (!sender.track) continue;
            const nt = stream.getTracks().find(t => t.kind === sender.track.kind);
            if (nt && nt.readyState === 'live') await sender.replaceTrack(nt);
          }
        } catch (e) {}
      }
    }
    window.recoverFromBackground = async function() {
      requestWakeLock();
      let needs = !localStream;
      if (localStream) needs = localStream.getTracks().some(t => t.readyState !== 'live');
      if (needs) {
        const s = await restartLocalMedia();
        if (s) await replaceTracksInCalls(s);
      } else {
        await replaceTracksInCalls(localStream);
      }
      document.querySelectorAll('video').forEach(v => { if (v.paused) v.play().catch(()=>{}); });
    };
    function onVisible() {
      if (document.visibilityState === 'visible') setTimeout(() => window.recoverFromBackground && window.recoverFromBackground(), 150);
    }
    document.addEventListener('visibilitychange', onVisible);
    window.addEventListener('focus', onVisible);
    window.addEventListener('pageshow', onVisible);

    // --- Permanent personal listener ---
    function showIncoming(title, name) {
      document.getElementById('callerName').textContent = name || 'Someone is calling…';
      document.getElementById('incoming').classList.add('show');
    }
    function hideIncoming() {
      document.getElementById('incoming').classList.remove('show');
    }

    async function getMedia() {
      if (localStream && localStream.getTracks().some(t => t.readyState === 'live')) return localStream;
      localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      document.getElementById('localVideo').srcObject = localStream;
      return localStream;
    }

    window.startPermanentListener = function startPermanentListener() {
      const id = window.getPermanentId ? window.getPermanentId() : '';
      if (!id) return;
      if (peer) { try { peer.destroy(); } catch(e) {} }
      peer = new Peer(id, { debug: 0, config: { iceServers: ICE } });
      peer.on('open', () => {
        document.getElementById('listenStatus').classList.remove('hidden');
        document.getElementById('listenStatus').textContent = 'Listening for calls as ' + id;
        console.log('Permanent ID online:', id);
      });
      peer.on('call', async (call) => {
        pendingCall = call;
        const name = call.metadata?.name || 'Someone';
        showIncoming('Incoming call', name + ' is calling…');
      });
      peer.on('error', e => console.warn('Permanent peer', e));
    };

    function updatePermanentUI() {
      const id = window.getPermanentId ? window.getPermanentId() : '';
      const d = document.getElementById('permanentLinkDisplay');
      const i = document.getElementById('permanentIdInput');
      if (d) d.textContent = id ? (window.getPermanentLink ? window.getPermanentLink(id) : '') : 'No permanent link set';
      if (i && id) i.value = id;
    }
    window.updatePermanentUI = updatePermanentUI;

    // Accept / Decline
    document.getElementById('acceptBtn').addEventListener('click', async () => {
      if (!pendingCall) return;
      hideIncoming();
      try {
        const stream = await getMedia();
        pendingCall.answer(stream);
        activeCalls.push(pendingCall);
        pendingCall.on('stream', remote => {
          document.getElementById('remoteVideo').srcObject = remote;
          document.getElementById('callScreen').classList.add('active');
          document.getElementById('lobby').style.display = 'none';
          requestWakeLock();
        });
        pendingCall.on('close', endCall);
      } catch (e) { alert('Could not start media: ' + e.message); }
      pendingCall = null;
    });
    document.getElementById('declineBtn').addEventListener('click', () => {
      if (pendingCall) { try { pendingCall.close(); } catch(e) {} }
      pendingCall = null;
      hideIncoming();
    });

    function endCall() {
      activeCalls.forEach(c => { try { c.close(); } catch(e) {} });
      activeCalls = [];
      document.getElementById('callScreen').classList.remove('active');
      document.getElementById('lobby').style.display = '';
      document.getElementById('remoteVideo').srcObject = null;
    }
    document.getElementById('endBtn').addEventListener('click', endCall);

    // Set / Copy permanent
    document.getElementById('setPermanentBtn').addEventListener('click', () => {
      const id = document.getElementById('permanentIdInput').value;
      if (window.setPermanentId) window.setPermanentId(id);
    });
    document.getElementById('copyPermanentBtn').addEventListener('click', () => {
      const id = window.getPermanentId ? window.getPermanentId() : '';
      if (!id) return alert('Set an ID first');
      const link = window.getPermanentLink(id);
      navigator.clipboard?.writeText(link).then(() => alert('Copied!'));
    });

    // Handle ?call= links (visitor is calling the permanent ID)
    (function handleCallParam() {
      const params = new URLSearchParams(window.location.search);
      const callId = params.get('call');
      if (!callId) return;
      document.getElementById('callerCard').classList.remove('hidden');
      document.getElementById('callerFine').textContent = 'You are calling ' + callId;
      document.getElementById('callBtn').textContent = 'Call ' + callId;
      document.getElementById('callBtn').onclick = async () => {
        myName = document.getElementById('name').value || 'Caller';
        try {
          const stream = await getMedia();
          const callerPeer = new Peer({ config: { iceServers: ICE } });
          callerPeer.on('open', () => {
            const call = callerPeer.call(callId, stream, { metadata: { name: myName } });
            activeCalls.push(call);
            call.on('stream', remote => {
              document.getElementById('remoteVideo').srcObject = remote;
              document.getElementById('callScreen').classList.add('active');
              document.getElementById('lobby').style.display = 'none';
              requestWakeLock();
            });
            call.on('close', endCall);
          });
          callerPeer.on('error', e => alert('Call failed: ' + (e.message || e.type)));
        } catch (e) { alert('Media error: ' + e.message); }
      };
    })();

    updatePermanentUI();
    // Auto-start listener if ID already set
    if (window.getPermanentId && window.getPermanentId()) {
      setTimeout(window.startPermanentListener, 300);
    }
  </script>
</body>
</html>
