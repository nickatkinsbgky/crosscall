<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0c1220" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CrossCall" />
  <title>CrossCall</title>
  <link rel="manifest" href="manifest.json" />
  <script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg: #0c1220;
      --card: #161e2e;
      --line: #2a3650;
      --text: #f4f7fb;
      --muted: #9aa8be;
      --blue: #3d7eff;
      --danger: #ff5d6c;
      --ok: #3dd68c;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overscroll-behavior: none;
      touch-action: manipulation;
    }
    button, input { font: inherit; color: inherit; }
    .screen { min-height: 100dvh; padding-top: var(--safe-top); padding-bottom: var(--safe-bottom); }
    .lobby {
      max-width: 460px;
      margin: 0 auto;
      padding: calc(28px + var(--safe-top)) 18px calc(40px + var(--safe-bottom));
    }
    .brand { display: flex; gap: 12px; align-items: center; margin-bottom: 18px; }
    .logo {
      width: 46px; height: 46px; border-radius: 14px;
      background: linear-gradient(160deg, #6aa2ff, #1d4ed8);
      display: grid; place-items: center; font-weight: 800; font-size: 20px;
    }
    h1 { margin: 0; font-size: 28px; letter-spacing: -.04em; }
    .sub { color: var(--muted); margin: 4px 0 0; font-size: 14px; line-height: 1.4; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; margin-top: 14px; }
    label { display: block; color: var(--muted); font-size: 12px; margin: 10px 0 6px; }
    input {
      width: 100%; background: #0f1728; border: 1px solid var(--line);
      border-radius: 12px; padding: 14px; outline: none; font-size: 16px;
    }
    input:focus { border-color: var(--blue); }
    .row { display: flex; gap: 8px; margin-top: 12px; }
    .btn {
      border: 0; border-radius: 12px; padding: 14px 16px; background: var(--blue);
      font-weight: 700; cursor: pointer; min-height: 48px; font-size: 16px;
    }
    .btn.secondary { background: #0f1728; border: 1px solid var(--line); font-weight: 600; }
    .btn.full { width: 100%; }
    .btn:disabled { opacity: .55; }
    .btn:active { transform: scale(0.98); }
    .fine { color: var(--muted); font-size: 13px; line-height: 1.45; margin-top: 8px; }
    .call {
      display: flex; flex-direction: column;
      min-height: 100dvh;
      padding-bottom: var(--safe-bottom);
    }
    .top {
      display: flex; justify-content: space-between; align-items: center;
      padding: calc(14px + var(--safe-top)) 14px 8px;
      gap: 8px;
    }
    .pill {
      background: #122033; border: 1px solid var(--line); border-radius: 999px;
      padding: 6px 12px; font-size: 13px; color: var(--muted); max-width: 55%;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .grid {
      flex: 1; display: grid; gap: 8px;
      padding: 8px 12px 12px;
      grid-template-columns: 1fr;
      min-height: 0;
    }
    .grid.multi { grid-template-columns: 1fr 1fr; }
    @media (max-width: 480px) {
      .grid.multi { grid-template-columns: 1fr; }
    }
    @media (orientation: landscape) and (max-height: 500px) {
      .grid { grid-template-columns: 1fr 1fr; }
      .tile { min-height: 120px; }
    }
    .tile {
      position: relative; background: #10192b; border-radius: 16px;
      overflow: hidden; min-height: 200px;
    }
    video {
      width: 100%; height: 100%; object-fit: cover; background: #0b1220;
      display: block; min-height: 200px;
    }
    .tag {
      position: absolute; left: 8px; bottom: 8px;
      background: rgba(0,0,0,.6); border-radius: 999px;
      padding: 5px 10px; font-size: 13px; font-weight: 600;
    }
    .local-tile { position: absolute; right: 12px; bottom: calc(90px + var(--safe-bottom)); width: 110px; height: 150px; z-index: 10; border-radius: 14px; border: 2px solid var(--line); }
    @media (min-width: 600px) {
      .local-tile { width: 140px; height: 190px; }
    }
    .controls {
      display: flex; justify-content: center; gap: 12px;
      padding: 8px 12px calc(16px + var(--safe-bottom));
      background: linear-gradient(to top, rgba(12,18,32,.95), transparent);
    }
    .round {
      width: 56px; height: 56px; border-radius: 50%; border: 0;
      background: #1b2740; color: white; font-size: 14px; font-weight: 700;
      display: grid; place-items: center; cursor: pointer;
    }
    .round:active { transform: scale(0.94); }
    .round.off { background: #3a2a2e; color: #ffb4bc; }
    .round.end { background: var(--danger); color: #2a0b10; width: 64px; height: 64px; }
    .status { color: var(--ok); font-size: 13px; }
    .err { color: #ffb4bc; font-size: 13px; margin-top: 8px; }
    .hidden { display: none !important; }
    .share-row { display: flex; gap: 8px; margin-top: 8px; }
    .share-row input { flex: 1; }

    /* Incoming call overlay */
    .incoming {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(8, 12, 22, 0.92);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: calc(24px + var(--safe-top)) 20px calc(24px + var(--safe-bottom));
      text-align: center;
    }
    .incoming h2 { margin: 0 0 6px; font-size: 26px; }
    .incoming .caller { font-size: 18px; color: var(--muted); margin-bottom: 28px; }
    .incoming .actions { display: flex; gap: 24px; }
    .incoming .round { width: 72px; height: 72px; font-size: 15px; }
    .incoming .accept { background: var(--ok); color: #0a1f14; }
    .incoming .decline { background: var(--danger); color: #2a0b10; }
    .pulse { animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.08); opacity: 0.85; }
    }
  </style>
</head>
<body>
  <!-- Lobby -->
  <div id="lobby" class="screen lobby">
    <div class="brand">
      <div class="logo">CC</div>
      <div>
        <h1>CrossCall</h1>
        <p class="sub">Video calls that work on iPhone, Android, and desktop.</p>
      </div>
    </div>

    <div class="card">
      <label for="name">Your name</label>
      <input id="name" type="text" placeholder="Your name" autocomplete="name" />

      <label for="room">Room code</label>
      <input id="room" type="text" placeholder="Leave blank to create a new room" autocomplete="off" />

      <div class="row">
        <button id="createBtn" class="btn full">Create Room</button>
        <button id="joinBtn" class="btn secondary full">Join Room</button>
      </div>
      <p class="fine">Share the room code. The host will get a ringtone and notification when someone joins.</p>
      <div id="lobbyErr" class="err hidden"></div>
    </div>
  </div>

  <!-- Incoming call overlay -->
  <div id="incoming" class="incoming hidden">
    <div class="logo pulse" style="width:64px;height:64px;font-size:28px;margin-bottom:16px;">CC</div>
    <h2>Incoming call</h2>
    <p class="caller" id="callerName">Someone is calling…</p>
    <div class="actions">
      <button id="declineBtn" class="round decline">Decline</button>
      <button id="acceptBtn" class="round accept">Accept</button>
    </div>
  </div>

  <!-- Call -->
  <div id="callScreen" class="call hidden">
    <div class="top">
      <div class="pill" id="roomPill">Room: —</div>
      <div class="status" id="status">Connecting…</div>
    </div>
    <div class="grid" id="videoGrid">
      <!-- remote videos go here -->
    </div>
    <div class="controls">
      <button id="micBtn" class="round" title="Mute">Mic</button>
      <button id="camBtn" class="round" title="Camera">Cam</button>
      <button id="endBtn" class="round end" title="End">End</button>
    </div>
  </div>

  <script>
    const lobby = document.getElementById('lobby');
    const callScreen = document.getElementById('callScreen');
    const incoming = document.getElementById('incoming');
    const callerNameEl = document.getElementById('callerName');
    const nameInput = document.getElementById('name');
    const roomInput = document.getElementById('room');
    const createBtn = document.getElementById('createBtn');
    const joinBtn = document.getElementById('joinBtn');
    const lobbyErr = document.getElementById('lobbyErr');
    const roomPill = document.getElementById('roomPill');
    const statusEl = document.getElementById('status');
    const videoGrid = document.getElementById('videoGrid');
    const micBtn = document.getElementById('micBtn');
    const camBtn = document.getElementById('camBtn');
    const endBtn = document.getElementById('endBtn');
    const acceptBtn = document.getElementById('acceptBtn');
    const declineBtn = document.getElementById('declineBtn');

    let peer, localStream, currentCall, roomCode, myName, isHost = false;
    let micOn = true, camOn = true;
    let wakeLock = null;
    let pendingCall = null;
    let ringtoneInterval = null;
    let audioCtx = null;

    function showErr(msg) {
      lobbyErr.textContent = msg;
      lobbyErr.classList.remove('hidden');
    }
    function hideErr() {
      lobbyErr.classList.add('hidden');
    }

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (e) { /* ignore */ }
    }
    function releaseWakeLock() {
      if (wakeLock) { wakeLock.release(); wakeLock = null; }
    }

    // Simple ringtone using Web Audio API (no external files)
    function startRingtone() {
      stopRingtone();
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        const playTone = () => {
          if (!audioCtx) return;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(440, audioCtx.currentTime);
          osc.frequency.setValueAtTime(480, audioCtx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
          osc.connect(gain).connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.4);
        };
        playTone();
        ringtoneInterval = setInterval(playTone, 1400);
      } catch (e) { /* ignore audio errors */ }
      // Vibrate on mobile
      if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 400]);
    }
    function stopRingtone() {
      if (ringtoneInterval) { clearInterval(ringtoneInterval); ringtoneInterval = null; }
      if (navigator.vibrate) navigator.vibrate(0);
    }

    function showBrowserNotification(title, body) {
      if (!('Notification' in window)) return;
      if (Notification.permission === 'granted') {
        try {
          new Notification(title, { body, tag: 'crosscall-incoming', renotify: true });
        } catch (e) {}
      }
    }

    async function requestNotifPermission() {
      if (!('Notification' in window)) return;
      if (Notification.permission === 'default') {
        try { await Notification.requestPermission(); } catch (e) {}
      }
    }

    async function getMedia() {
      try {
        return await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: true
        });
      } catch (e) {
        throw new Error('Camera/microphone access denied or unavailable. Check permissions.');
      }
    }

    function createLocalVideo(stream) {
      const existing = document.querySelector('.local-tile');
      if (existing) existing.remove();
      const tile = document.createElement('div');
      tile.className = 'tile local-tile';
      const v = document.createElement('video');
      v.srcObject = stream;
      v.muted = true;
      v.autoplay = true;
      v.playsInline = true;
      v.setAttribute('playsinline', '');
      tile.appendChild(v);
      const tag = document.createElement('div');
      tag.className = 'tag';
      tag.textContent = myName || 'You';
      tile.appendChild(tag);
      document.body.appendChild(tile);
      v.play().catch(() => {});
    }

    function addRemoteVideo(stream, label) {
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.dataset.peer = label;
      const v = document.createElement('video');
      v.srcObject = stream;
      v.autoplay = true;
      v.playsInline = true;
      v.setAttribute('playsinline', '');
      tile.appendChild(v);
      const tag = document.createElement('div');
      tag.className = 'tag';
      tag.textContent = label || 'Remote';
      tile.appendChild(tag);
      videoGrid.appendChild(tile);
      if (videoGrid.children.length > 1) videoGrid.classList.add('multi');
      v.play().catch(() => {});
    }

    function startCall(asHost, room) {
      hideErr();
      myName = nameInput.value.trim() || 'User';
      isHost = asHost;
      roomCode = room || Math.random().toString(36).slice(2, 8).toUpperCase();

      lobby.classList.add('hidden');
      callScreen.classList.remove('hidden');
      roomPill.textContent = 'Room: ' + roomCode;
      statusEl.textContent = asHost ? 'Waiting for someone to join…' : 'Connecting…';

      requestWakeLock();
      if (asHost) requestNotifPermission();

      getMedia().then(stream => {
        localStream = stream;
        createLocalVideo(stream);

        peer = new Peer(asHost ? roomCode : undefined, {
          debug: 1,
          config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }
        });

        peer.on('open', id => {
          if (!asHost) {
            const call = peer.call(roomCode, localStream, { metadata: { name: myName } });
            setupCall(call);
          }
        });

        peer.on('call', call => {
          // Host receives incoming call — show notification UI instead of auto-answering
          pendingCall = call;
          const caller = call.metadata?.name || 'Someone';
          callerNameEl.textContent = caller + ' is calling…';
          incoming.classList.remove('hidden');
          statusEl.textContent = 'Incoming call';
          startRingtone();
          showBrowserNotification('Incoming CrossCall', caller + ' is calling you');
        });

        peer.on('error', err => {
          statusEl.textContent = 'Error';
          showErr(err.message || 'Connection failed');
          endCall();
        });

      }).catch(err => {
        showErr(err.message);
        endCall();
      });
    }

    function acceptCall() {
      if (!pendingCall || !localStream) return;
      stopRingtone();
      incoming.classList.add('hidden');
      pendingCall.answer(localStream);
      setupCall(pendingCall);
      statusEl.textContent = 'Connected';
      pendingCall = null;
    }

    function declineCall() {
      stopRingtone();
      incoming.classList.add('hidden');
      if (pendingCall) {
        pendingCall.close();
        pendingCall = null;
      }
      statusEl.textContent = isHost ? 'Waiting for someone to join…' : 'Call declined';
    }

    function setupCall(call) {
      currentCall = call;
      call.on('stream', remoteStream => {
        const name = call.metadata?.name || 'Remote';
        addRemoteVideo(remoteStream, name);
        statusEl.textContent = 'In call';
        stopRingtone();
        incoming.classList.add('hidden');
      });
      call.on('close', () => {
        statusEl.textContent = 'Call ended';
        setTimeout(endCall, 800);
      });
      call.on('error', () => statusEl.textContent = 'Connection lost');
    }

    function endCall() {
      stopRingtone();
      if (pendingCall) { pendingCall.close(); pendingCall = null; }
      if (currentCall) { currentCall.close(); currentCall = null; }
      if (peer) { peer.destroy(); peer = null; }
      if (localStream) {
        localStream.getTracks().forEach(t => t.stop());
        localStream = null;
      }
      releaseWakeLock();
      document.querySelectorAll('.local-tile').forEach(el => el.remove());
      videoGrid.innerHTML = '';
      videoGrid.classList.remove('multi');
      incoming.classList.add('hidden');
      callScreen.classList.add('hidden');
      lobby.classList.remove('hidden');
      statusEl.textContent = 'Connecting…';
    }

    createBtn.addEventListener('click', () => startCall(true, roomInput.value.trim() || undefined));
    joinBtn.addEventListener('click', () => {
      const room = roomInput.value.trim();
      if (!room) { showErr('Enter a room code to join'); return; }
      startCall(false, room);
    });

    acceptBtn.addEventListener('click', acceptCall);
    declineBtn.addEventListener('click', declineCall);

    micBtn.addEventListener('click', () => {
      if (!localStream) return;
      micOn = !micOn;
      localStream.getAudioTracks().forEach(t => t.enabled = micOn);
      micBtn.classList.toggle('off', !micOn);
      micBtn.textContent = micOn ? 'Mic' : 'Muted';
    });

    camBtn.addEventListener('click', () => {
      if (!localStream) return;
      camOn = !camOn;
      localStream.getVideoTracks().forEach(t => t.enabled = camOn);
      camBtn.classList.toggle('off', !camOn);
      camBtn.textContent = camOn ? 'Cam' : 'Off';
    });

    endBtn.addEventListener('click', endCall);

    // Copy room code on pill click
    roomPill.addEventListener('click', () => {
      if (navigator.clipboard && roomCode) {
        navigator.clipboard.writeText(roomCode).then(() => {
          const orig = roomPill.textContent;
          roomPill.textContent = 'Copied!';
          setTimeout(() => roomPill.textContent = orig, 1500);
        });
      }
    });

    // Restore name if previously used
    try {
      const saved = localStorage.getItem('crosscall-name');
      if (saved) nameInput.value = saved;
    } catch (e) {}
    nameInput.addEventListener('change', () => {
      try { localStorage.setItem('crosscall-name', nameInput.value.trim()); } catch (e) {}
    });
  </script>
</body>
</html>
